# UART Bridge Daemon Configuration
# This file configures the UART bridge daemon that forwards data
# from USB UART to TTY/AMA0 UART on Raspberry Pi 5

# USB UART device path (usually /dev/ttyUSB0 or /dev/ttyACM0)
usb_uart_device=/dev/ttyUSB0

# AMA UART device path (Raspberry Pi hardware UART)
ama_uart_device=/dev/ttyAMA0

# Baud rate for both UARTs
# Supported values: 9600, 19200, 38400, 57600, 115200, 230400, 460800, 921600
baud_rate=115200

# Data bits (5, 6, 7, or 8)
data_bits=8

# Stop bits (1 or 2)
stop_bits=1

# Parity (N=None, E=Even, O=Odd)
parity=N